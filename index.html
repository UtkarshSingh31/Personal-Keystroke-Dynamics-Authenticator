<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Typing Behaviour Collection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #faf9f6;
      --card: #ffffff;
      --text: #111111;
      --muted: #555555;
      --border: #dddddd;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 40px 20px;
    }

    .container { max-width: 900px; margin: 0 auto; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      font-size: 16px;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-family: monospace;
    }

    select {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      border-radius: 8px;
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    button {
      background: #000;
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 16px;
    }

    .status { font-size: 14px; color: var(--muted); margin-top: 10px; }

    .preview {
      margin-top: 16px;
      padding: 12px;
      background: #f7f7f7;
      border: 1px solid var(--border);
      border-radius: 8px;
      white-space: pre-wrap;
      font-family: monospace;
    }

    .prompt-box {
      margin-top: 10px;
      padding: 12px;
      background: #f3f3f3;
      border-left: 4px solid #000;
      border-radius: 6px;
      font-size: 14px;
    }

    .progress {
      font-weight: 700;
      margin: 18px 0 8px;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .requirements {
      font-size: 13px;
      color: var(--muted);
    }
  </style>
</head>

<body>
<div class="container">
  <div class="card">
    <h2>Typing Behaviour Data Collection</h2>
    <p>Please type naturally. Do not deliberately type slowly or quickly, and do not copy-paste.</p>

    <label for="userIdSelect">Participant ID</label>
    <select id="userIdSelect" aria-label="Participant ID">
      <option value="">Choose an available ID</option>
    </select>
    <p id="rememberedId" class="status">Your selected ID will be remembered in this browser.</p>

    <p id="sessionProgress" class="progress">Session 1 / 8</p>

    <select id="questionSelect" aria-label="Current typing prompt" disabled>
      <option>Loading session...</option>
    </select>

    <div id="selectedPrompt" class="prompt-box"></div>

    <p id="requirements" class="requirements">Minimum: 50 words and 200 keystroke events.</p>
    <p id="wordCount" class="progress">Words: 0 / 50</p>

    <p id="timer" class="status">Time elapsed: 0:00</p>

    <textarea id="box" placeholder="Start typing here..."></textarea>

    <button id="submitButton" onclick="submitData()" disabled>Submit session</button>
    <div id="status" class="status">Enter a user ID to begin.</div>

    <div id="preview" class="preview"></div>
  </div>
</div>

<!-- ✅ FIXED SUPABASE CDN (Pinned Version) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.4/dist/umd/supabase.min.js"></script>

<script>
  const SUPABASE_URL = "https://mryfvjiigepemmchtzlb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1yeWZ2amlpZ2VwZW1tY2h0emxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAyMDA2MTYsImV4cCI6MjA4NTc3NjYxNn0.l6gmbJ4Kg7wmObfN2H3_pi15oD-O45SxH7L-oCo6J4I";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const TOTAL_USERS = 15;
  const OWNER_USER_ID = 11;
  const TOTAL_SESSIONS = 8;
  const MIN_WORDS = 50;
  const MIN_EVENTS = 200;
  const prompts = [
    "Describe your typical daily routine and the parts you enjoy most.",
    "How has technology changed the way people learn, work, or communicate?",
    "Describe a college, school, or work project and what you learned from it.",
    "Tell the story of a memorable experience and why it stayed with you.",
    "Share your opinion on a topic you care about and explain your reasoning.",
    "Describe a place you know well so someone else can imagine being there.",
    "Explain a concept, skill, or process that you understand clearly.",
    "Write freely about any subject that interests you today."
  ];

  const savedUserId = localStorage.getItem("dynamoauth_user_id");
  const box = document.getElementById("box");
  const userIdSelect = document.getElementById("userIdSelect");
  const rememberedId = document.getElementById("rememberedId");
  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  const timerEl = document.getElementById("timer");
  const questionSelect = document.getElementById("questionSelect");
  const selectedPrompt = document.getElementById("selectedPrompt");
  const sessionProgress = document.getElementById("sessionProgress");
  const wordCountEl = document.getElementById("wordCount");
  const submitButton = document.getElementById("submitButton");
  const requirements = document.getElementById("requirements");

  let keyDownTime = {};
  let sequence = [];
  let lastRelease = null;
  let typedText = "";
  let startTime = null;
  let timerInterval = null;
  let currentSession = 1;
  let userId = Number(savedUserId);

  for (let id = 1; id <= TOTAL_USERS; id++) {
    const option = document.createElement("option");
    option.value = String(id);
    option.textContent = `User ID ${id}${id === OWNER_USER_ID ? " (owner)" : ""}`;
    userIdSelect.appendChild(option);
  }

  if (Number.isInteger(userId) && userId >= 1 && userId <= TOTAL_USERS) {
    userIdSelect.value = String(userId);
    rememberedId.textContent = `Remembered user ID: ${userId}. Change it above if needed.`;
  } else {
    userId = NaN;
    box.disabled = true;
  }

  function countWords(text) {
    const normalized = text.trim();
    return normalized ? normalized.split(/\s+/).length : 0;
  }

  function updateRequirements() {
    const words = countWords(typedText);
    const wordsReady = words >= MIN_WORDS;
    const eventsReady = sequence.length >= MIN_EVENTS;
    wordCountEl.textContent = `Words: ${Math.min(words, MIN_WORDS)} / ${MIN_WORDS}${wordsReady ? " ✓" : ""}`;
    submitButton.disabled = !(wordsReady && eventsReady && currentSession <= TOTAL_SESSIONS);
    requirements.textContent = wordsReady && eventsReady
      ? "Ready to submit this session."
      : `Minimum: ${MIN_WORDS} words and ${MIN_EVENTS} keystroke events (${sequence.length}/${MIN_EVENTS} events).`;
  }

  function showPrompt() {
    questionSelect.innerHTML = "";
    prompts.forEach((promptText, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = `Session ${index + 1}: ${promptText}`;
      option.selected = index === currentSession - 1;
      questionSelect.appendChild(option);
    });
    selectedPrompt.textContent = prompts[currentSession - 1];
    sessionProgress.textContent = `Session ${currentSession} / ${TOTAL_SESSIONS}`;
  }

  async function loadProgress() {
    if (!Number.isInteger(userId) || userId < 1 || userId > TOTAL_USERS) {
      status.textContent = `User ID must be an integer from 1 to ${TOTAL_USERS}.`;
      box.disabled = true;
      return;
    }

    const { count, error } = await supabaseClient
      .from("typing_sessions")
      .select("session_id", { count: "exact", head: true })
      .eq("user_id", userId);

    if (error) {
      status.textContent = "Could not load session progress. Check the Supabase policy or connection.";
      box.disabled = true;
      return;
    }

    currentSession = Math.min((count || 0) + 1, TOTAL_SESSIONS + 1);
    if (currentSession > TOTAL_SESSIONS) {
      sessionProgress.textContent = "Enrollment complete: 8 / 8 sessions submitted";
      selectedPrompt.textContent = "Thank you. This user's standardized data collection is complete.";
      questionSelect.innerHTML = "<option>Collection complete</option>";
      box.disabled = true;
      status.textContent = "All eight sessions have already been completed.";
      return;
    }

    showPrompt();
    box.disabled = false;
    status.textContent = `User ${userId} ready. Type naturally for session ${currentSession}.`;
    updateRequirements();
  }

  function resetCurrentSession() {
    box.value = "";
    preview.textContent = "";
    typedText = "";
    sequence = [];
    lastRelease = null;
    keyDownTime = {};
    startTime = null;
    clearInterval(timerInterval);
    timerInterval = null;
    timerEl.textContent = "Time elapsed: 0:00";
    updateRequirements();
  }

  userIdSelect.addEventListener("change", () => {
    userId = Number(userIdSelect.value);
    if (!Number.isInteger(userId) || userId < 1 || userId > TOTAL_USERS) {
      localStorage.removeItem("dynamoauth_user_id");
      rememberedId.textContent = "Choose one of the available participant IDs to begin.";
      box.disabled = true;
      return;
    }

    localStorage.setItem("dynamoauth_user_id", String(userId));
    rememberedId.textContent = `Remembered user ID: ${userId}. Change it above if needed.`;
    currentSession = 1;
    resetCurrentSession();
    questionSelect.disabled = true;
    status.textContent = "Loading saved session progress...";
    loadProgress();
  });

  function startTimer() {
    if (timerInterval) return;
    startTime = performance.now();
    timerInterval = setInterval(() => {
      const s = Math.floor((performance.now() - startTime) / 1000);
      timerEl.textContent =
        `Time elapsed: ${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
    }, 500);
  }

  box.addEventListener("keydown", e => {
    startTimer();
    if (!e.repeat && !keyDownTime[e.code]) keyDownTime[e.code] = performance.now();
  });

  box.addEventListener("keyup", e => {
    const press = keyDownTime[e.code];
    if (!press) return;

    const now = performance.now();
    const hold = (now - press) / 1000;
    const flight = lastRelease ? Math.max(0, (press - lastRelease) / 1000) : 0;
    lastRelease = now;

    typedText = box.value;

    preview.textContent = typedText;

    if (Number.isFinite(hold) && hold > 0 && Number.isFinite(flight) && flight >= 0) {
      sequence.push({
        key: e.key,
        hold_time: Number(hold.toFixed(4)),
        flight_time: Number(flight.toFixed(4))
      });
    }

    delete keyDownTime[e.code];
    updateRequirements();
  });

  box.addEventListener("input", () => {
    typedText = box.value;
    preview.textContent = typedText;
    updateRequirements();
  });

  box.addEventListener("paste", e => e.preventDefault());

  async function submitData() {
    const words = countWords(typedText);
    if (!Number.isInteger(userId) || userId < 1 || userId > TOTAL_USERS || currentSession > TOTAL_SESSIONS) {
      status.textContent = "Invalid user or completed collection.";
      return;
    }
    if (words < MIN_WORDS || sequence.length < MIN_EVENTS) {
      status.textContent = `Complete at least ${MIN_WORDS} words and ${MIN_EVENTS} valid keystroke events first.`;
      return;
    }

    submitButton.disabled = true;
    status.textContent = "Submitting session...";

    const session_id = crypto.randomUUID();
    const label = userId === OWNER_USER_ID ? 1 : 0;

    const { error } = await supabaseClient
      .from("typing_sessions")
      .insert({
        user_id: userId,
        session_id,
        label,
        data: {
          user_id: userId,
          session_id,
          label,
          sequence,
          text_typed: typedText,
          word_count: words,
          session_number: currentSession
        }
      });

    if (error) {
      console.error(error);
      status.textContent = "Submission failed. No session progress was advanced.";
      updateRequirements();
      return;
    }

    currentSession++;

    box.value = "";
    preview.textContent = "";
    typedText = "";
    sequence = [];
    lastRelease = null;
    keyDownTime = {};
    startTime = null;
    clearInterval(timerInterval);
    timerInterval = null;
    timerEl.textContent = "Time elapsed: 0:00";

    if (currentSession > TOTAL_SESSIONS) {
      sessionProgress.textContent = "Enrollment complete: 8 / 8 sessions submitted";
      selectedPrompt.textContent = "Thank you. This user's standardized data collection is complete.";
      questionSelect.innerHTML = "<option>Collection complete</option>";
      box.disabled = true;
      submitButton.disabled = true;
      requirements.textContent = "All required sessions are complete.";
      status.textContent = "Data submitted successfully. Enrollment complete.";
      return;
    }

    showPrompt();
    status.textContent = `Session ${currentSession - 1} saved. Continue with session ${currentSession}.`;
    updateRequirements();
  }

  loadProgress();
</script>

</body>
</html>
